name: Testes API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
      testes:
        runs-on: ubuntu-latest

        services:
          postgres:
            image: postgres:16
            env:
              POSTGRES_DB: gestao_emprestimos_test
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres_test
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U postgres -d gestao_emprestimos_test"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 5

        steps:
          - name: Baixar codigo
            uses: actions/checkout@v4

          - name: Configurar Java 17
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '17'
              cache: maven

          - name: Executar testes
            run: mvn -B test
            env:
                SPRING_PROFILES_ACTIVE: test
                DB_PASSWORD: postgres_test
                APP_LOGIN_EMAIL: admin@teste.com
                APP_LOGIN_PASSWORD: SenhaAdminTeste123!
                APP_COLAB_EMAIL: colaborador@teste.com
                APP_COLAB_PASSWORD: SenhaColabTeste123!
                JWT_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'